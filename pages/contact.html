<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Portfolio</title>
    <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>

    <header class="header">
        <nav class="header__nav">
            <ul class="header__menu">
                <li class="header__item"><a class="header__link" href="../index.html">Home</a></li>
                <li class="header__item"><a class="header__link" href="projects.html">Projects</a></li>
                <li class="header__item"><a class="header__link" href="skills.html">Skills</a></li>
                <li class="header__item"><a class="header__link" href="cv.html">CV</a></li>
                <li class="header__item"><a class="header__link" href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="main">
        <section class="contact">
            <h1 class="contact__title">Contact Me</h1>
            <form class="contact__form" id="contactForm">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit">Send</button>
            </form>
            <p class="contact__note">You can also reach me via <a href="mailto:malek.darouazi@epitech.eu">email</a>.</p>
        </section>
    </main>

    <footer class="footer">
        <p class="footer__text">© 2026 Malek Darwouazi</p>
    </footer>

    <script src="../assets/js/main.js"></script>
</body>
</html>
